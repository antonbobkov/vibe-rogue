name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: unit + meta + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run e2e

  # PLN-04 / PLN-06 M11: the full 200-seed BAL-07 sweep. Separate job, 45-minute timeout, no
  # matrix, no retries. Required for the M11, M12 and M13 DoD — since M13 it also has to come back
  # green rather than with an accepted skip (`DIF-17`: `BALANCE_SKIPS` is empty).
  sim:
    name: BAL-07 simulation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run sim
